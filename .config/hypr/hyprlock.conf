# PASSWORD-TEXT
label {
    monitor =
    text = Password:
    color = rgba(120, 201, 166, 0.96)
    font_size = 17
    font_family = FiraCode Nerd Font 
    position = 0, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 40
    rounding = 0
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(69, 99, 52)
    inner_color = rgb(40, 40, 40)
    font_color = rgb(200, 200, 200)
    fail_color = rgb(220, 74, 58)
    fade_on_empty = false
    font_family = FiraCode Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -125
    halign = center
    valign = center
}

shape {
    monitor =
    size = 115, 30
    color =rgba(11, 249, 221, 0)
    rounding = 5
    border_size = 2
    border_color = rgb(114, 239, 129)
    position = -1, 1
    halign = left
    valign = top
    zindex = 1
}

# Power off
label {
    monitor =
    text = <span>󰐥 </span>
    color = rgb(114, 239, 129)
    font_family = FiraCode Nerd Font 
    font_size = 16
    onclick = shutdown now
    position = 11, -2
    halign = left
    valign = top
    zindex = 2
}

# Reboot
label {
    monitor =
    text =  <span>󰑓 </span>
    color = rgb(114, 239, 129)
    font_family = FiraCode Nerd Font 
    font_size = 15
    onclick = reboot now
    position = 50, -3
    halign = left
    valign = top
    zindex = 2
}



# Suspend
label {
    monitor =
    text = <span>󰤄 </span>
    color = rgb(114, 239, 129)
    font_family = FiraCode Nerd Font 
    font_size = 16
    onclick = systemctl suspend
    position = 92, -2
    halign = left
    valign = top
    zindex = 2
}