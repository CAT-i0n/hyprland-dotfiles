# Максимальное значение гаммы для ручной регулировки через hyprctl
max-gamma = 120

# Утро и день (08:00) — лёгкое снижение синего для комфортной работы с текстом
profile {
    time = 08:00
    temperature = 5200
    gamma = 0.90
}

# Вечер (18:00) — более тёплый и мягкий свет
profile {
    time = 18:00
    temperature = 4500
    gamma = 0.85
}

# Ночь (22:00) — максимально тёплый и приглушённый режим для чтения перед сном
profile {
    time = 22:00
    temperature = 3800
    gamma = 0.85
}